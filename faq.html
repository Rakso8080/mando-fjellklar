<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Spørsmål & svar — M&O</title>
<meta name="description" content="Svar på vanlige spørsmål om bestilling, frakt, retur og brukte varer hos M&O."/>
<meta property="og:title" content="FAQ — M&O"/>
<meta name="theme-color" content="#2F3E46"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="M&O"/>
<meta name="mobile-web-app-capable" content="yes"/>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="manifest" href="manifest.json"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&amp;family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;display=swap" onload="this.onload=null;this.rel=&#39;stylesheet&#39;"/>
    
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div class="page-body">

<section class="about-hero" style="padding:72px 0 60px">
  <div class="container" style="position:relative">
    <p style="font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:14px;font-weight:500">Hjelp</p>
    <h1 class="about-hero__title" style="font-size:clamp(32px,5vw,52px)">Spørsmål &amp; svar</h1>
    <p class="about-hero__sub" style="font-size:15px">Finner du ikke svaret? <button onclick="MO.showModal('kontakt')" style="background:none;border:none;color:rgba(255,255,255,.75);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:15px;font-family:inherit">Ta kontakt med oss.</button></p>
  </div>
</section>

<section class="section">
  <div class="container" style="max-width:760px">

    <div class="faq-cats" id="faq-cats">
      <button class="faq-cat active" onclick="MO.faqFilter(this,'alle')">Alle</button>
      <button class="faq-cat" onclick="MO.faqFilter(this,'bestilling')">Bestilling</button>
      <button class="faq-cat" onclick="MO.faqFilter(this,'frakt')">Frakt & retur</button>
      <button class="faq-cat" onclick="MO.faqFilter(this,'brukt')">Brukte varer</button>
      <button class="faq-cat" onclick="MO.faqFilter(this,'selg')">Selg til oss</button>
    </div>

    <div class="faq-list" id="faq-list"></div>

    <div style="text-align:center;margin-top:56px;padding:40px;background:var(--g10);border-radius:16px;border:1px solid var(--g8)">
      <p style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--g5);margin-bottom:10px;font-weight:500">Ikke funnet svaret?</p>
      <h3 style="font-family:var(--serif);font-size:22px;color:var(--g3);margin-bottom:8px">Vi hjelper gjerne</h3>
      <p style="font-size:14px;color:var(--text-3);margin-bottom:20px">Vanligvis svarer vi innen én virkedag.</p>
      <button class="btn btn-primary" onclick="MO.showModal('kontakt')">Send oss en melding</button>
    </div>

  </div>
</section>

</div>

<script src="data/products.js"></script>
<script src="js/app.js"></script>
<script src="js/layout.js"></script>
<script>
MO.injectLayout('');

var faqs = [
  {cat:'bestilling', q:'Hvordan legger jeg inn en bestilling?', a:'Finn produktet du vil ha, velg størrelse og klikk "Legg i handlekurv". Gå til handlekurv og velg betalingsmåte. Vi støtter Vipps, Klarna og kortbetaling.'},
  {cat:'bestilling', q:'Kan jeg endre eller avbestille bestillingen min?', a:'Ta kontakt med oss så raskt som mulig via kontaktskjemaet. Vi kan endre eller avbestille ordren så lenge den ikke er pakket og sendt.'},
  {cat:'bestilling', q:'Hvilke betalingsmetoder godtar dere?', a:'Vi godtar Vipps, Klarna (delbetaling og faktura), Visa, Mastercard og American Express. Alle transaksjoner er SSL-kryptert.'},
  {cat:'bestilling', q:'Får jeg en ordrebekreftelse?', a:'Ja, en bekreftelse sendes automatisk til e-postadressen din rett etter at bestillingen er lagt inn.'},
  {cat:'frakt', q:'Hva koster frakt?', a:'Standardlevering koster 69 kr. Frakt er gratis på alle bestillinger over 999 kr. Ekspresslevering (neste virkedag) koster 149 kr ved bestilling innen kl. 12.'},
  {cat:'frakt', q:'Hvor lang er leveringstiden?', a:'Standardlevering tar 1–3 virkedager. Ekspress leverer neste virkedag hvis du bestiller innen kl. 12. Vi sender med PostNord og Bring.'},
  {cat:'frakt', q:'Hva er returpolicyen?', a:'Vi har 14 dagers returrett på alle varer — også brukte. Pakk inn varen i originalemballasje der det er mulig og lever den på nærmeste Post i Butikk. Vi refunderer innen 3–5 virkedager etter mottak.'},
  {cat:'frakt', q:'Hvem betaler for returfrakten?', a:'Kunden betaler returfrakten. Prisen vil variere avhengig av pakkens vekt og størrelse, men er typisk 69–99 kr via PostNord.'},
  {cat:'brukt', q:'Hva betyr "Topptrim", "Turerfaren" og "Arbeidshest"?', a:'"Topptrim" betyr brukt 1–3 ganger eller aldri — ingen synlige merker. "Turerfaren" betyr noe pilling eller lett misfarging, men full funksjon. "Arbeidshest" betyr tydelig slitasje, men alle tekniske funksjoner som glidelåser, membraner og sting fungerer som de skal.'},
  {cat:'brukt', q:'Er brukte varer vasket og rengjort?', a:'Ja. Alle brukte plagg vaskes og rengjøres grundig før vi legger dem ut. Vi sjekker også alle tekniske funksjoner — glidelåser, membraner, sting og velcro.'},
  {cat:'brukt', q:'Kan jeg stole på standbeskrivelsen?', a:'Vi tar dette veldig seriøst. Alle plagg fotograferes og beskrives ærlig. Hvis vi oppdager noe vi ikke har nevnt, har du 14 dagers returrett uten spørsmål.'},
  {cat:'brukt', q:'Er det bare én av hvert brukte plagg?', a:'Ja, alle brukte varer er unike eksemplarer. Når de er solgt, er de borte. Vi viser "Siste eksemplar" på produktkort slik at du vet det haster.'},
  {cat:'selg', q:'Hvordan selger jeg klær til M&O?', a:'Bruk "Selg til oss"-skjemaet (finn det i footeren). Beskriv plaggene og legg ved bilder. Vi gir deg et tilbud innen 24 timer. Vi betaler deg enten kontant eller som butikkreditt (10 % bonus).'},
  {cat:'selg', q:'Hvilke merker kjøper dere inn?', a:'Vi kjøper inn brukte plagg fra kjente fjellmerker som Arc\'teryx, Norrøna, Patagonia, Bergans, Helly Hansen, Salomon, Mammut, Black Diamond, Fjällräven og lignende.'},
  {cat:'selg', q:'Hvilken stand krever dere på plaggene?', a:'Vi kjøper inn alt fra Topptrim til Arbeidshest — så lenge alle tekniske funksjoner fungerer. Vi tar ikke imot plagg med rifter, ødelagte glidelåser eller manglende knapper.'},
  {cat:'selg', q:'Hvordan sender jeg inn plaggene?', a:'Etter at vi har blitt enige om pris, sender vi deg en forhåndsbetalt fraktetikett. Pack plaggene godt og lever dem på nærmeste PostNord-punkt.'},
];

MO._allFaqs = faqs;
MO._activeCat = 'alle';

MO.renderFaqs = function(list) {
  var el = document.getElementById('faq-list');
  el.innerHTML = list.map(function(f, i) {
    return '<div class="faq-item" data-cat="' + f.cat + '">' +
      '<button class="faq-q" onclick="MO.toggleFaq(this)">' +
      f.q +
      '<span class="faq-q__icon"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="5" y1="1" x2="5" y2="9"/><line x1="1" y1="5" x2="9" y2="5"/></svg></span>' +
      '</button>' +
      '<div class="faq-a"><div class="faq-a__inner">' + f.a + '</div></div>' +
      '</div>';
  }).join('');
};

MO.toggleFaq = function(btn) {
  var item = btn.closest('.faq-item');
  var isOpen = item.classList.contains('open');
  document.querySelectorAll('.faq-item.open').forEach(function(i){ i.classList.remove('open'); });
  if (!isOpen) item.classList.add('open');
};

MO.faqFilter = function(btn, cat) {
  document.querySelectorAll('.faq-cat').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  MO._activeCat = cat;
  var list = cat === 'alle' ? MO._allFaqs : MO._allFaqs.filter(function(f){ return f.cat === cat; });
  MO.renderFaqs(list);
};

MO.renderFaqs(faqs);
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
