<link rel="stylesheet" href="css/style.css?v=2"/>
<style>
  .offline { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; text-align: center; padding: 40px 20px; }
  .offline__icon { width: 64px; height: 64px; color: var(--g6); margin-bottom: 24px; }
  .offline__title { font-family: var(--heading); font-size: clamp(24px,5vw,32px); font-weight: 600; color: var(--g3); margin-bottom: 12px; }
  .offline__text { font-size: 15px; color: var(--text-3); max-width: 400px; margin-bottom: 32px; line-height: 1.6; }
  .offline__btn { display: inline-flex; align-items: center; gap: 8px; }
  .offline__cached { font-size: 13px; color: var(--text-4); margin-top: 24px; }
  .offline__cached a { color: var(--g5); text-decoration: underline; }
</style>
</head>
<body>
<div class="offline">
  <svg class="offline__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
    <path d="M22.61 16.36A9 9 0 0 0 7.47 5.68"/>
    <path d="M18.2 14.35A5 5 0 0 0 6.71 9.2"/>
    <line x1="1" y1="1" x2="23" y2="23"/>
    <path d="M10.77 18.3a1.5 1.5 0 1 0 1.96 1.1"/>
    <path d="M16.5 21.5h-10"/>
  </svg>
  <h1 class="offline__title">Ingen tilkobling</h1>
  <p class="offline__text">Du ser ut til å være uten nett. Produktene du har sett tidligere er lagret og kan fortsatt vises.</p>
  <button class="btn btn-primary btn-lg offline__btn" onclick="window.location.reload()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    Prøv igjen
  </button>
  <p class="offline__cached">Eller gå til <a href="index.html">hjemmesiden</a>.</p>
</div>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
