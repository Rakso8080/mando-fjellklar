<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Handlekurv — M&O</title>
<meta name="description" content="Gjennomgå din handlekurv hos M&O — nye og brukte fjellklær til gode priser."/>
<meta property="og:title" content="Handlekurv — M&O"/>
<meta property="og:description" content="Gjør klar bestillingen din hos M&O."/>
<meta property="og:type" content="website"/>
<meta name="theme-color" content="#2F3E46"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="M&O"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="robots" content="noindex"/>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="manifest" href="manifest.json"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="css/style.css?v=2"/>
<script src="https://js.stripe.com/v3/"></script>
</head>
<body>
<div class="page-body">
<section class="section">
  <div class="container">
    <div style="font-size:12px;color:var(--text-4);margin-bottom:16px;display:flex;gap:6px;align-items:center">
      <a href="index.html" style="cursor:pointer;color:var(--text-4);transition:color .15s">Hjem</a>
      <span>/</span>
      <span style="color:var(--text)">Handlekurv</span>
    </div>
    <h1 style="font-family:var(--serif);font-size:clamp(28px,4vw,40px);font-weight:500;color:var(--g3);margin-bottom:8px">Handlekurv</h1>
    <p style="font-size:14px;color:var(--text-3);margin-bottom:40px" id="cart-count-label">Du har 0 varer</p>

    <div id="cart-content"></div>
  </div>
</section>
</div>

<script src="js/app.js?v=3"></script>
<script src="js/layout.js?v=2"></script>
<script>
/* ── STRIPE CONFIG — bytt til dine egne nøkler ──────────
   Hent nøkler fra: https://dashboard.stripe.com/apikeys
   Publishable key: pk_test_... (trygt å eksponere i frontend)
   Restricted key:  rk_test_... (KUN på server, ikke her)
─────────────────────────────────────────────────────── */
var STRIPE_PUBLISHABLE_KEY = 'pk_test_51TeiI8FyHhYyUG7N2oehEZwIS3KxzEE3g8ssM5tVH2WJisycfyyLmFTvOPBl5yEcAym4hcZzZfnVc4meSwj83WaK00tgdFII90';

MO.injectLayout('');

function renderCartPage() {
  var el = document.getElementById('cart-content');
  var lbl = document.getElementById('cart-count-label');
  var count = MO.cart.reduce(function(s,i){return s+i.qty;},0);
  lbl.textContent = 'Du har ' + count + (count === 1 ? ' vare' : ' varer');

  if (MO.cart.length === 0) {
    var suggestions = MO.recentViewed.length
      ? MO.recentViewed.map(MO.findProduct).filter(Boolean).slice(0,4)
      : MO.products.slice(0,4);
    el.innerHTML = '<div style="text-align:center;padding:60px 0 40px">' +
      '<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="var(--gray-300)" stroke-width="0.8" stroke-linecap="round" style="margin:0 auto 18px;display:block"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>' +
      '<p style="font-size:18px;font-weight:500;color:var(--text-2);margin-bottom:8px">Handlekurven er tom</p>' +
      '<p style="font-size:14px;color:var(--text-4);margin-bottom:24px">Du har ikke lagt til noen produkter ennå.</p>' +
      '<a href="index.html" class="btn btn-primary btn-lg">Gå til butikken</a>' +
      '</div>' +
      '<div style="border-top:1px solid var(--gray-200);padding-top:40px">' +
      '<p style="font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--text-4);font-weight:600;margin-bottom:24px">' + (MO.recentViewed.length ? 'Nylig sett' : 'Populære produkter') + '</p>' +
      '<div class="product-grid">' + suggestions.map(MO.cardHTML).join('') + '</div>' +
      '</div>';
    return;
  }

  var total = MO.cartTotal();
  var frakt = total >= 999 ? 0 : 69;
  var totalMedFrakt = total + frakt;

  el.innerHTML = '<div class="cart-grid">' +
    '<div class="cart-items">' +
    MO.cart.map(function(item) {
      return '<div class="cart-page-item">' +
        '<div class="cart-page-item__img"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.8" stroke-linecap="round"><path d="M20.38 3.46L16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.57a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.57a2 2 0 0 0-1.34-2.23z"/></svg></div>' +
        '<div style="flex:1">' +
        '<div class="cart-page-item__brand">' + item.brand + '</div>' +
        '<div class="cart-page-item__name">' + item.name + '</div>' +
        '<div class="cart-page-item__meta">Str. ' + item.size + '</div>' +
        '<div class="qty-ctrl">' +
        '<button class="qty-ctrl__btn" onclick="MO.changeQty(\'' + item.id + '\',\'' + item.size + '\',-1);renderCartPage()">−</button>' +
        '<span class="qty-ctrl__num">' + item.qty + '</span>' +
        '<button class="qty-ctrl__btn" onclick="MO.changeQty(\'' + item.id + '\',\'' + item.size + '\',1);renderCartPage()">+</button>' +
        '</div>' +
        '<div class="cart-page-item__price">' + (item.price * item.qty).toLocaleString('no-NO') + ' kr</div>' +
        '<span class="cart-page-item__rm" onclick="MO.removeFromCart(\'' + item.id + '\',\'' + item.size + '\');renderCartPage()">Fjern</span>' +
        '</div></div>';
    }).join('') +
    '</div>' +
    '<div class="express-pay">' +
    '<button class="express-pay__btn express-pay__btn--vipps" onclick="MO.checkout()" aria-label="Betal med Vipps"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15l-4-4 1.41-1.41L11 14.17l6.59-6.59L19 9l-8 8z"/></svg> Vipps</button>' +
    '<button class="express-pay__btn express-pay__btn--apple" onclick="MO.checkout()" aria-label="Betal med Apple Pay"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C5.71 17.7 4.3 13.42 6.43 10.16c1.02-1.55 2.56-2.45 4.2-2.48 1.28-.03 2.49.48 3.35.48.85 0 2.44-.59 3.68-.5.63.01 2.39.25 3.52 1.91-.09.06-2.1 1.23-2.08 3.67.02 2.91 2.55 3.88 2.58 3.9-.02.07-.4 1.38-1.33 2.73l-.1.02zM14.06 5.17c.78-.95 2.08-1.64 3.2-1.67.04 1.23-.34 2.39-1.09 3.24-.75.85-1.81 1.39-2.94 1.32-.05-1.08.35-2.2 1.04-2.89z"/></svg> Apple Pay</button>' +
    '</div>' +
    '<div class="cart-summary">' +
    '<p class="cart-summary__title">Ordresammendrag</p>' +
    '<div class="cart-summary__row"><span>Subtotal</span><span>' + total.toLocaleString('no-NO') + ' kr</span></div>' +
    '<div class="cart-summary__row"><span>Frakt</span><span>' + (frakt === 0 ? '<span style="color:var(--g5)">Gratis</span>' : frakt + ' kr') + '</span></div>' +
    (frakt > 0 ? '<p style="font-size:12px;color:var(--g5);margin-bottom:10px">Gratis frakt ved kjøp over 999 kr</p>' : '') +
    '<div class="cart-summary__row cart-summary__row--total"><span>Total</span><span>' + totalMedFrakt.toLocaleString('no-NO') + ' kr</span></div>' +
    '<div class="promo-row" style="margin-top:16px" id="promo-wrap">' +
    '<input type="text" id="promo-input" class="form-input" placeholder="Rabattkode" autocomplete="off"/>' +
    '<button class="btn btn-ghost btn-sm" onclick="MO.applyPromo()">Bruk</button>' +
    '</div>' +
    '<button id="checkout-btn" class="btn btn-primary btn-full btn-lg" onclick="MO.checkout()">Gå til sikker betaling →</button>' +
    '<a href="index.html" class="btn btn-ghost btn-full" style="margin-top:8px">Fortsett å handle</a>' +
    '<div style="display:flex;flex-direction:column;gap:8px;margin-top:20px;padding-top:18px;border-top:1px solid var(--gray-100)">' +
    '<div style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-4)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>14 dagers returrett</div>' +
    '<div style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-4)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>Trygg betaling med Vipps og Klarna</div>' +
    '</div>' +
    '</div>' +
    '</div>';
}

MO.checkout = function() {
  var btn = document.getElementById('checkout-btn');
  if (!btn) return;

  /* Vis kvittering i modalen mens vi venter */
  var frakt = MO.cartTotal() >= 999 ? 0 : 69;
  var total = MO.cartTotal() + frakt;
  MO.openModal('Til betaling',
    '<div style="background:var(--g10);border-radius:12px;padding:16px;margin-bottom:16px">' +
    MO.cart.map(function(i){ return '<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text-3);margin-bottom:6px"><span>' + i.brand + ' ' + i.name.split(' ').slice(0,3).join(' ') + ' · ' + i.size + '</span><span>' + (i.price*i.qty).toLocaleString('no-NO') + ' kr</span></div>'; }).join('') +
    '<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text-3);margin-bottom:6px"><span>Frakt</span><span>' + (frakt === 0 ? 'Gratis' : frakt + ' kr') + '</span></div>' +
    '<div style="display:flex;justify-content:space-between;font-size:16px;font-weight:500;margin-top:10px;padding-top:10px;border-top:1px solid var(--gray-200)"><span>Total</span><span style="font-family:var(--serif);color:var(--g3)">' + total.toLocaleString('no-NO') + ' kr</span></div>' +
    '</div>' +
    '<button id="stripe-pay-btn" class="btn btn-primary btn-full btn-lg" onclick="MO._startStripeCheckout()" style="margin-bottom:8px">Gå til sikker betaling →</button>' +
    '<p style="font-size:11.5px;color:var(--text-4);text-align:center">🔒 Sikker betaling via Stripe · SSL-kryptert</p>'
  );
};

MO._startStripeCheckout = function() {
  var payBtn = document.getElementById('stripe-pay-btn');
  if (payBtn) { payBtn.disabled = true; payBtn.textContent = 'Kobler til Stripe…'; }

  /* Bygg linjeposter */
  var lineItems = MO.cart.map(function(i) {
    return {
      name: i.brand + ' ' + i.name,
      description: 'Størrelse: ' + i.size + (i.type === 'brukt' ? ' · Brukt' : ' · Nytt'),
      price: i.price,
      qty: i.qty,
    };
  });
  var frakt = MO.cartTotal() >= 999 ? 0 : 69;
  if (frakt > 0) lineItems.push({ name: 'Frakt', description: 'Standard levering 1–3 virkedager', price: frakt, qty: 1 });

  /* Kall serverless-funksjonen */
  fetch('/.netlify/functions/create-checkout', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      lineItems: lineItems,
      successUrl: window.location.origin + '/checkout-success.html?session_id={CHECKOUT_SESSION_ID}',
      cancelUrl: window.location.href,
    }),
  })
  .then(function(res) { return res.json(); })
  .then(function(data) {
    if (data.url) {
      /* Lagre kurven midlertidig så vi kan rydde opp ved retur */
      sessionStorage.setItem('mo_pending_cart', JSON.stringify(MO.cart));
      window.location.href = data.url;
    } else {
      throw new Error(data.error || 'Ukjent feil');
    }
  })
  .catch(function(err) {
    MO.closeModal();
    MO.toast('Noe gikk galt: ' + err.message);
    console.error('Stripe checkout error:', err);
  });
};

renderCartPage();
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
